# FORK: builds this fork's image and publishes it to ghcr.io -- see FORK.md.
#
# Upstream's build.yml is left untouched (it only runs on upstream's own branch, or by hand) so that
# merging a new upstream release never conflicts here.
name: Fork Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Also build linux/arm64 (much slower: emulated)'
        type: boolean
        default: false

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Fetch upstream release tags
        # -> What the version is described from: this repo carries upstream's history but not its tags
        run: git fetch --no-tags https://github.com/requarks/wiki.git 'refs/tags/3.*:refs/tags/3.*'

      - name: Set Version
        run: |
          # -> The upstream release this is built on, plus the commit, e.g. 3.0.2-fork.g836b86b
          UPSTREAM_TAG=$(git describe --tags --abbrev=0 --match '3.*' --exclude '*-*')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            REL_VERSION="${GITHUB_REF_NAME#v}"
          else
            REL_VERSION="${UPSTREAM_TAG}-fork.g${GITHUB_SHA::7}"
          fi
          echo "REL_VERSION=${REL_VERSION}" >> $GITHUB_ENV
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      - name: Build Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      - name: Generate Docker Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Wiki.js (wikijs3-custom)
            org.opencontainers.image.description=Wiki.js 3 with Apprise notifications
            org.opencontainers.image.version=${{ env.REL_VERSION }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: inputs.arm64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: ${{ inputs.arm64 && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
